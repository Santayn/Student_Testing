kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# Путь проекта содержит кириллицу (D:\Универ\...)
android.overridePathCheck=true
kotlin.native.ignoreDisabledTargets=true

# Kotlin 2.4 IC падает на этом проекте («Storage ... is already registered» при закрытии кешей,
# воспроизводится и на чистом каталоге сборки). Полная перекомпиляция shared занимает ~30 с.
kotlin.incremental=false
