name: student-test

services:
  postgres:
    image: postgres:16-alpine
    container_name: student-test-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-student_test}
      POSTGRES_USER: ${POSTGRES_USER:-student_test}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-student_test} -d ${POSTGRES_DB:-student_test}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: student-test-backend:latest
    container_name: student-test-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-student_test}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-student_test}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_SQL_INIT_MODE: ${SPRING_SQL_INIT_MODE:-always}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:-50MB}
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:-200MB}
      APP_DATA_LOADER_ENABLED: ${APP_DATA_LOADER_ENABLED:-true}
      APP_PUBLIC_REGISTRATION_ENABLED: ${APP_PUBLIC_REGISTRATION_ENABLED:-false}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in .env (at least 32 characters)}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:[*],http://127.0.0.1:[*]}
      APP_DATABASE_BACKUP_PG_DUMP_PATH: ${APP_DATABASE_BACKUP_PG_DUMP_PATH:-pg_dump}
      APP_DATABASE_BACKUP_PSQL_PATH: ${APP_DATABASE_BACKUP_PSQL_PATH:-psql}
      APP_DATABASE_BACKUP_SCHEMA: ${APP_DATABASE_BACKUP_SCHEMA:-}
      APP_DATABASE_BACKUP_INCLUDE_CLEAN: ${APP_DATABASE_BACKUP_INCLUDE_CLEAN:-true}
      APP_AI_PROVIDER: ${APP_AI_PROVIDER:-none}
      APP_AI_BASE_URL: ${APP_AI_BASE_URL:-}
      APP_AI_API_KEY: ${APP_AI_API_KEY:-}
      APP_AI_FOLDER_ID: ${APP_AI_FOLDER_ID:-}
      APP_AI_AUTH_SCHEME: ${APP_AI_AUTH_SCHEME:-}
      APP_AI_TIMEOUT_SECONDS: ${APP_AI_TIMEOUT_SECONDS:-90}
      APP_AI_MONTHLY_TOKEN_LIMIT: ${APP_AI_MONTHLY_TOKEN_LIMIT:-20000000}
      APP_AI_MODEL_GRADING: ${APP_AI_MODEL_GRADING:-aliceai-llm-flash}
      APP_AI_MODEL_LECTURE: ${APP_AI_MODEL_LECTURE:-aliceai-llm-flash}
      APP_AI_MODEL_PRESENTATION: ${APP_AI_MODEL_PRESENTATION:-aliceai-llm}
      APP_AI_MODEL_IMAGE: ${APP_AI_MODEL_IMAGE:-aliceai-image-art-3.0}
      APP_AI_GRADING_ENABLED: ${APP_AI_GRADING_ENABLED:-true}
      APP_AI_GRADING_REVIEW_THRESHOLD: ${APP_AI_GRADING_REVIEW_THRESHOLD:-0.7}
      APP_AI_OCR_PROVIDER: ${APP_AI_OCR_PROVIDER:-}
      APP_AI_IMAGE_GENERATION_ENABLED: ${APP_AI_IMAGE_GENERATION_ENABLED:-true}
      APP_AI_IMAGE_SEARCH_ENABLED: ${APP_AI_IMAGE_SEARCH_ENABLED:-true}
      APP_AI_PRESENTATION_MAX_SOURCE_CHARS: ${APP_AI_PRESENTATION_MAX_SOURCE_CHARS:-60000}
      APP_AI_STORAGE_DIR: /app/uploads/ai
      SERVER_PORT: 8080
      APP_STORAGE_LECTURE_MATERIALS_DIR: /app/uploads/lecture-materials
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - lecture-uploads:/app/uploads/lecture-materials
      - ai-files:/app/uploads/ai
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP_PUBLIC_REGISTRATION_ENABLED: ${APP_PUBLIC_REGISTRATION_ENABLED:-false}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_API_TIMEOUT_MS: ${VITE_API_TIMEOUT_MS:-15000}
        VITE_SUBMIT_TIMEOUT_MS: ${VITE_SUBMIT_TIMEOUT_MS:-180000}
        VITE_FILE_TRANSFER_TIMEOUT_MS: ${VITE_FILE_TRANSFER_TIMEOUT_MS:-0}
    image: student-test-frontend:latest
    container_name: student-test-frontend
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "8080"
      PROXY_SEND_TIMEOUT: ${FRONTEND_PROXY_SEND_TIMEOUT:-300s}
      PROXY_READ_TIMEOUT: ${FRONTEND_PROXY_READ_TIMEOUT:-300s}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  postgres-data:
  lecture-uploads:
  ai-files:
