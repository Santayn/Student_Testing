spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: CREATE EXTENSION IF NOT EXISTS citext
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:200MB}
  jpa:
    defer-datasource-initialization: true
    open-in-view: false
    hibernate:
        ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
        naming:
          physical-strategy: org.santayn.testing.config.QuotedIdentifierNamingStrategy
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
server:
  port: ${SERVER_PORT:8080}
app:
  data-loader:
    enabled: ${APP_DATA_LOADER_ENABLED:false}
  registration:
    public-enabled: ${APP_PUBLIC_REGISTRATION_ENABLED:false}
  security:
    jwt:
      secret: ${APP_JWT_SECRET}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}
  storage:
    lecture-materials-dir: ${APP_STORAGE_LECTURE_MATERIALS_DIR:uploads/lecture-materials}
  database-backup:
    pg-dump-path: ${APP_DATABASE_BACKUP_PG_DUMP_PATH:pg_dump}
    psql-path: ${APP_DATABASE_BACKUP_PSQL_PATH:psql}
    schema: ${APP_DATABASE_BACKUP_SCHEMA:}
    include-clean: ${APP_DATABASE_BACKUP_INCLUDE_CLEAN:true}
  ai:
    provider: ${APP_AI_PROVIDER:none}
    base-url: ${APP_AI_BASE_URL:}
    api-key: ${APP_AI_API_KEY:}
    folder-id: ${APP_AI_FOLDER_ID:}
    auth-scheme: ${APP_AI_AUTH_SCHEME:}
    timeout-seconds: ${APP_AI_TIMEOUT_SECONDS:90}
    monthly-token-limit: ${APP_AI_MONTHLY_TOKEN_LIMIT:20000000}
    models:
      grading: ${APP_AI_MODEL_GRADING:aliceai-llm-flash}
      lecture: ${APP_AI_MODEL_LECTURE:aliceai-llm-flash}
      presentation: ${APP_AI_MODEL_PRESENTATION:aliceai-llm}
      image: ${APP_AI_MODEL_IMAGE:aliceai-image-art-3.0}
    grading:
      enabled: ${APP_AI_GRADING_ENABLED:true}
      review-threshold: ${APP_AI_GRADING_REVIEW_THRESHOLD:0.7}
    ocr:
      provider: ${APP_AI_OCR_PROVIDER:}
      tesseract-path: ${APP_AI_OCR_TESSERACT_PATH:tesseract}
    images:
      generation-enabled: ${APP_AI_IMAGE_GENERATION_ENABLED:true}
      search-enabled: ${APP_AI_IMAGE_SEARCH_ENABLED:true}
    presentation:
      max-source-chars: ${APP_AI_PRESENTATION_MAX_SOURCE_CHARS:60000}
    storage:
      dir: ${APP_AI_STORAGE_DIR:uploads/ai}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
  packages-to-scan: org.santayn.testing.web.controller.rest
  paths-to-match:
    - /api/v1/**
logging:
  level:
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR
