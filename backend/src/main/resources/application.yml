spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: CREATE EXTENSION IF NOT EXISTS citext
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:200MB}
  jpa:
    defer-datasource-initialization: true
    open-in-view: false
    hibernate:
        ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
        naming:
          physical-strategy: org.santayn.testing.config.QuotedIdentifierNamingStrategy
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
server:
  port: ${SERVER_PORT:8080}
app:
  data-loader:
    enabled: ${APP_DATA_LOADER_ENABLED:false}
  registration:
    public-enabled: ${APP_PUBLIC_REGISTRATION_ENABLED:false}
  openapi:
    public-enabled: ${APP_OPENAPI_PUBLIC_ENABLED:false}
  security:
    jwt:
      secret: ${APP_JWT_SECRET}
    refresh-cookie:
      name: ${APP_AUTH_REFRESH_COOKIE_NAME:student_test_refresh}
      csrf-cookie-name: ${APP_AUTH_CSRF_COOKIE_NAME:student_test_csrf}
      secure: ${APP_AUTH_REFRESH_COOKIE_SECURE:true}
      same-site: ${APP_AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
    auth-rate-limit:
      login:
        max-failures: ${APP_AUTH_LOGIN_MAX_FAILURES:5}
        window-seconds: ${APP_AUTH_LOGIN_WINDOW_SECONDS:300}
        block-seconds: ${APP_AUTH_LOGIN_BLOCK_SECONDS:60}
      refresh:
        max-failures: ${APP_AUTH_REFRESH_MAX_FAILURES:10}
        window-seconds: ${APP_AUTH_REFRESH_WINDOW_SECONDS:300}
        block-seconds: ${APP_AUTH_REFRESH_BLOCK_SECONDS:60}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}
  storage:
    lecture-materials-dir: ${APP_STORAGE_LECTURE_MATERIALS_DIR:uploads/lecture-materials}
  database-backup:
    pg-dump-path: ${APP_DATABASE_BACKUP_PG_DUMP_PATH:pg_dump}
    psql-path: ${APP_DATABASE_BACKUP_PSQL_PATH:psql}
    schema: ${APP_DATABASE_BACKUP_SCHEMA:}
    include-clean: ${APP_DATABASE_BACKUP_INCLUDE_CLEAN:true}
  text-answer-grading:
    worker:
      enabled: ${APP_TEXT_ANSWER_GRADING_WORKER_ENABLED:true}
      poll-delay-ms: ${APP_TEXT_ANSWER_GRADING_POLL_DELAY_MS:1000}
      batch-size: ${APP_TEXT_ANSWER_GRADING_BATCH_SIZE:5}
      max-attempts: ${APP_TEXT_ANSWER_GRADING_MAX_ATTEMPTS:3}
      retry-delay-seconds: ${APP_TEXT_ANSWER_GRADING_RETRY_DELAY_SECONDS:5}
      claim-timeout-seconds: ${APP_TEXT_ANSWER_GRADING_CLAIM_TIMEOUT_SECONDS:60}
    local-llm:
      enabled: ${APP_TEXT_ANSWER_LOCAL_LLM_ENABLED:false}
      endpoint: ${APP_TEXT_ANSWER_LOCAL_LLM_ENDPOINT:http://127.0.0.1:11434/api/generate}
      model: ${APP_TEXT_ANSWER_LOCAL_LLM_MODEL:qwen2.5:1.5b-instruct}
      timeout-seconds: ${APP_TEXT_ANSWER_LOCAL_LLM_TIMEOUT_SECONDS:12}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
  packages-to-scan: org.santayn.testing.web.controller.rest
  paths-to-match:
    - /api/v1/**
logging:
  level:
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR
